<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>WalletConnect v2 dApp</title>

  <!-- Load WalletConnect Local Loader -->
  <script src="walletconnect-loader.js"></script>

  <!-- Ethers.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.8.1/ethers.umd.min.js"></script>

  <style>
    body { background:#0b0f26; color:white; text-align:center; font-family:Arial; }
    #connectBtn {
      padding:14px 28px; background:#4c8cff; border:none; font-size:20px;
      border-radius:10px; cursor:pointer; margin-top:40px;
    }
    #dashboard {
      margin-top:30px; background:#111936; padding:20px;
      display:none; width:350px; margin-left:auto; margin-right:auto;
      border-radius:12px;
    }
  </style>
</head>

<body>
  <h1>Premium WalletConnect v2 dApp</h1>
  <button id="connectBtn">Connect Wallet</button>

  <div id="dashboard">
    <p><b>Address:</b> <span id="addr"></span></p>
    <p><b>Chain:</b> <span id="chain"></span></p>
    <p><b>Balance:</b> <span id="bal"></span></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
